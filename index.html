<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cubo AR con marcador</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/app.js" defer></script>
</head>
<body>
    <header id="info">
        <h1>Cubo AR con marcador</h1>
        <p>Imprime el marcador Hiro o ábrelo en otra pantalla. Después, apunta la cámara hacia él.</p>
        <a href="./marcador.html" target="_blank" rel="noopener">Ver / imprimir marcador Hiro</a>
    </header>
    <div id="ar-controls">
        <p id="ar-status" role="status" aria-live="polite">Listo. Necesitas buena luz y ver el borde completo del marcador.</p>
        <button id="ar-button" type="button">Iniciar cámara</button>
    </div>
    <noscript>Activa JavaScript para utilizar esta experiencia.</noscript>
</body>
</html>
